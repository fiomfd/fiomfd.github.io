<!--

シンガポールの中学後半におけるG3レベルの数学と Additional Mathematics, さらにJCの数学の参考書(JCには検定教科書のようなものはありません)の特長について、日本国の高校数学III&Cと比較しながら述べることにします。さらに、中学後半とJCの数学で学習が物理学の学習をサポートしているかどうかを見るために、中学後半のG3レベルの物理とJCの物理の参考書を検証します。

### **シンガポールの数学の教科書の特長**

シンガポールの数学教科書の特長は以下の2点に集約される。

1. 本質的な部分をじっくり解説していて公式の提供は最小限に抑えられており、各話題のつながりも比較的把握しやすいので、教科書の全体像や教科の全体像が見えやすい。
2. よく練られた適度な難易度の演習問題が豊富であり、教科書の解説をじっくり勉強し演習問題にじっくり取り組むだけでもかなりの学力に到達することが期待される。

一方、日本国の数学教科書の残念な特徴は以下の通りであろう。

1. 話題を細切れにして見開き2頁の中に少なくとも公式が1つは提供されている。そのため覚えるべき公式の数が異常に多く、また本質的に同じような公式でも別の公式として提供されていることも少なからずある。
2. 演習問題は公式に数値を代入するだけで答が得られるものしかなく、学習者の勉学をサポートするような適度な難易度の演習問題がない。


### **中学3-4年 数学**
中学3-4年のG3レベルの数学3A, 3B, 4A, 4B を紹介する。標準的な話題は省略して特筆すべき話題について述べる。

中学数学3Aでは、指数法則になれるための十分な段階的準備をした上で指数関数が導入される。
また $y=1/x$ も扱われる。平面図形の話題は日本国の中学数学よりもレベルが高いであろう。

中学数学3Bでは、三角関数が導入され、平面図形の話題は一段と難しくなる。

中学数学4Aでは、統計と確率の基礎、データ行列としての行列、行列の演算が導入される。日本国の高校数学では高校数学Cで数ベクトルが導入されるに留まっていることに注意する。

中学数学4Bでは、平面ベクトルが導入されて平面図形に応用される。これは JC H2 Math の3次元数ベクトルのための準備と言ってよいであろう。その後は中学3-4年の数学の復習であり O-Level 試験の準備かと思われる。

### **JC H2 Math：3次元数ベクトルの幾何学**
JC H2 Math の話題は、数列と級数、初等関数とグラフ、微分積分、3次元数ベクトル (vector geometry), 統計と確率である。特に、3次元数ベクトルの基礎と応用について徹底的に勉強することになっており、これは大学入学後の物理学の学習の基礎となることを目指しているように思われる。JC H2 Math に曲線の長さ・常微分方程式の初等解法・多変数関数の微分積分・連立一次方程式と行列式を上乗せすれば、大学の入門レベルの物理学を学ぶ準備としては完璧であろう。

### **中学4年 Additional Mathematics B (微分積分)**
Additional mathematics A は2次関数や不等式などの話題を数多く扱うが特筆すべきものはない。Additional Mathematics B は1変数関数の微分積分である。シンガポール流のゆったりした解説と数多くの良質な演習問題で構成されており、日本国の高校数学IIIの教科書よりも圧倒的に優れている。さらに微分積分の最後の章は運動学 (kinematics) であり、位置・速度・加速度・速さ・道のりなどを微分積分を通じて学ぶことになっている。日本国の高校数学IIIでは微分法と積分法の各章末に申し訳程度に運動学に関する記述があるが、焼け石に水である。

### **中学3-4年物理 & JC H2 Physics**
中学3-4年の物理は教科書の本文が400頁くらいである。主に身近にある様々な物理現象をじっくりと解説しており、現象の時間変化を表すグラフ・地震波の縦波と横波の分解図・電磁場の磁力線図など適切な図による説明も非常に多い。数学の利用は極めて抑制的であり、300頁を超えたあたりから等式で与えられる法則を利用した初等的な計算問題が見られるようになり、JC H2 Physics に滑らかに接続している。

JC H2 Physics では、数ベクトルを必要最小限に利用しているが、半分程度が質点の力学であり、それ以外は波動・熱・電気回路・電磁気・量子効果・核物理を少しずつ解説している。演習問題は等式で表される法則を利用した演習問題がほとんどである。Additional Mathematics B の微分積分や運動学の利用はない。

日本国では、数ベクトルは高校数学Cで初めて登場するが、中学3年の理科では力を表す矢印が登場する。高等学校の物理基礎と物理には重複が非常に多いが、基本的には等式で与えられる法則を利用した演習問題がほとんどである。教科書の付録に中途半端な微分積分の解説などが書かれている。シンガポールの数学の利用に抑制的な物理教育とは対照的であり日本国の物理教育は教育効果を考えない無謀な印象を受ける。
